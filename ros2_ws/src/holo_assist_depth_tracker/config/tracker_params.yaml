holo_assist_depth_tracker:
  ros__parameters:
    rgb_topic: /camera/camera/color/image_raw
    rgb_topic_fallback: /camera/color/image_raw

    apriltag_topic: /detections_all
    apriltag_topic_fallback: /detections
    apriltag_timeout_s: 1.0
    cube_pose_topic_prefix: /holoassist/perception
    cube_size_m: 0.040

    # Calibration tag (eye-to-hand, tag36h11 family)
    calib_tag_id: 1

    # Cube face tag IDs — 6 tags per cube
    april_cube_1_tag_ids: [10, 11, 12, 13, 14, 15]
    april_cube_2_tag_ids: [16, 17, 18, 19, 20, 21]
    april_cube_3_tag_ids: [22, 23, 24, 25, 26, 27]
    april_cube_4_tag_ids: [28, 29, 30, 31, 32, 33]
